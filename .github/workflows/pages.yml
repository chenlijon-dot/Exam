name: Deploy quiz to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stamp build version
        run: sed -i 's/__BUILD_SHA__/${{ github.sha }}/g' index.html

      - name: Stamp homepage version timestamp
        run: |
          BUILD_TS="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          sed -i "s|__BUILD_TIMESTAMP__|${BUILD_TS}|g" exam-branding.js

      - name: Prevent legacy start-screen flash
        run: |
          # index.html still contains the original science difficulty selector as a legacy
          # runtime screen. The catalog is now the real site entry point. Hide the legacy
          # start screen in the deployed HTML from the first paint; catalog/runtime code
          # can still remove the hidden class later if it intentionally needs that screen.
          sed -i 's|<section id="startScreen">|<section id="startScreen" class="hidden">|' index.html

      - name: Enable homepage branding
        run: |
          sed -i 's|</body>|<script src="exam-branding.js?v=${{ github.sha }}"></script></body>|' index.html

      - name: Enable in-app browser history
        run: |
          # Load the history bridge last so it can reuse the navigation callbacks already
          # installed by catalog, past-exam, chapter-bank and runtime modules.
          sed -i 's|</body>|<script src="exam-browser-history.js?v=${{ github.sha }}"></script></body>|' index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
