# Preview source SHA: aefbe84d4b23fb2fec339f217cb5dc3807f5c2ae
name: Deploy quiz to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stamp build version
        run: sed -i 's/__BUILD_SHA__/${{ github.sha }}/g' index.html

      - name: Stamp homepage version timestamp
        run: |
          BUILD_TS="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          sed -i "s|__BUILD_TIMESTAMP__|${BUILD_TS}|g" exam-branding.js

      - name: Enable plain static GEPT vocabulary data
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          base = Path('chapter-bank/english/gept/elementary/vocabulary/static')
          files = [base / f'gept-vocab-{i:02d}.js' for i in range(1, 9)]
          files.append(base / 'gept-vocab-ready.js')
          missing = [str(path) for path in files if not path.is_file()]
          if missing:
              raise SystemExit('Missing static vocabulary files: ' + ', '.join(missing))

          html_path = Path('index.html')
          html = html_path.read_text(encoding='utf-8')
          needle = '<script src="exam-navigation-fix.js?v='
          pos = html.find(needle)
          if pos < 0:
              raise SystemExit('Could not find exam-navigation-fix.js in index.html')

          build_sha = os.environ.get('BUILD_SHA', 'unknown')
          tags = ''.join(
              f'<script src="{path.as_posix()}?v={build_sha}"></script>\n'
              for path in files
          )
          html = html[:pos] + tags + html[pos:]
          html_path.write_text(html, encoding='utf-8')
          print('Enabled 8 static GEPT vocabulary parts + ready converter')
          PY

      - name: Prevent legacy start-screen flash
        run: |
          sed -i 's|<section id="startScreen">|<section id="startScreen" class="hidden">|' index.html

      - name: Enable in-app browser history
        run: |
          sed -i 's|</body>|<script src="exam-browser-history.js?v=${{ github.sha }}"></script></body>|' index.html

      # 1-3 is loaded by exam-navigation-fix.js -> exam-science-lab.js.
      # Do not inject the older exam-science-lab-banks.js here: that legacy
      # module uses a DOM MutationObserver which can retrigger itself and lock
      # the Unit 1 screen in an endless update loop.

      - name: Enable homepage branding
        run: |
          sed -i 's|</body>|<script src="exam-branding.js?v=${{ github.sha }}"></script></body>|' index.html

      - name: Checkout question history preview branch
        uses: actions/checkout@v4
        with:
          ref: question-history-recall
          path: _preview-src

      - name: Build question history preview subsite
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import shutil
          import subprocess

          source = Path('_preview-src')
          preview = Path('preview/question-history-recall')

          if preview.exists():
              shutil.rmtree(preview)

          shutil.copytree(
              source,
              preview,
              ignore=shutil.ignore_patterns('.git')
          )

          sha = subprocess.check_output(
              ['git', '-C', str(source), 'rev-parse', 'HEAD'],
              text=True
          ).strip()

          iso = subprocess.check_output(
              ['git', '-C', str(source), 'show', '-s', '--format=%cI', 'HEAD'],
              text=True
          ).strip()

          env = os.environ.copy()
          env['TZ'] = 'Asia/Taipei'
          ts = subprocess.check_output(
              ['date', '-d', iso, '+%Y-%m-%d %H:%M'],
              text=True,
              env=env
          ).strip()

          html_path = preview / 'index.html'
          html = html_path.read_text(encoding='utf-8')
          html = html.replace('__BUILD_SHA__', sha)

          base = preview / 'chapter-bank/english/gept/elementary/vocabulary/static'
          files = [base / f'gept-vocab-{i:02d}.js' for i in range(1, 9)]
          files.append(base / 'gept-vocab-ready.js')
          missing = [str(path) for path in files if not path.is_file()]
          if missing:
              raise SystemExit('Missing preview vocabulary files: ' + ', '.join(missing))

          needle = '<script src="exam-navigation-fix.js?v='
          if 'gept-vocab-01.js?v=' not in html:
              pos = html.find(needle)
              if pos < 0:
                  raise SystemExit('Could not find preview exam-navigation-fix.js')
              tags = ''.join(
                  f'<script src="{path.relative_to(preview).as_posix()}?v={sha}"></script>\n'
                  for path in files
              )
              html = html[:pos] + tags + html[pos:]

          html = html.replace(
              '<section id="startScreen">',
              '<section id="startScreen" class="hidden">'
          )

          if 'exam-browser-history.js?v=' not in html:
              html = html.replace(
                  '</body>',
                  f'<script src="exam-browser-history.js?v={sha}"></script></body>'
              )

          if 'exam-branding.js?v=' not in html:
              html = html.replace(
                  '</body>',
                  f'<script src="exam-branding.js?v={sha}"></script></body>'
              )

          html_path.write_text(html, encoding='utf-8')

          branding_path = preview / 'exam-branding.js'
          branding = branding_path.read_text(encoding='utf-8')
          branding = branding.replace(
              '__BUILD_TIMESTAMP__',
              f'測試版 {ts}'
          )
          branding_path.write_text(branding, encoding='utf-8')

          print(f'Preview built at /preview/question-history-recall/ from {sha} ({ts})')
          PY

          rm -rf _preview-src

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
