name: Deploy quiz to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stamp build version
        run: sed -i 's/__BUILD_SHA__/${{ github.sha }}/g' index.html

      - name: Stamp homepage version timestamp
        run: |
          BUILD_TS="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          sed -i "s|__BUILD_TIMESTAMP__|${BUILD_TS}|g" exam-branding.js

      - name: Enable plain static GEPT vocabulary data
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          base = Path('chapter-bank/english/gept/elementary/vocabulary/static')
          files = [base / f'gept-vocab-{i:02d}.js' for i in range(1, 9)]
          files.append(base / 'gept-vocab-ready.js')
          missing = [str(path) for path in files if not path.is_file()]
          if missing:
              raise SystemExit('Missing static vocabulary files: ' + ', '.join(missing))

          html_path = Path('index.html')
          html = html_path.read_text(encoding='utf-8')
          needle = '<script src="exam-navigation-fix.js?v='
          pos = html.find(needle)
          if pos < 0:
              raise SystemExit('Could not find exam-navigation-fix.js in index.html')

          build_sha = os.environ.get('BUILD_SHA', 'unknown')
          tags = ''.join(
              f'<script src="{path.as_posix()}?v={build_sha}"></script>\n'
              for path in files
          )
          html = html[:pos] + tags + html[pos:]
          html_path.write_text(html, encoding='utf-8')
          print('Enabled 8 static GEPT vocabulary parts + ready converter')
          PY

      - name: Prevent legacy start-screen flash
        run: |
          sed -i 's|<section id="startScreen">|<section id="startScreen" class="hidden">|' index.html

      - name: Enable in-app browser history
        run: |
          sed -i 's|</body>|<script src="exam-browser-history.js?v=${{ github.sha }}"></script></body>|' index.html

      - name: Enable science 1-3 laboratory banks
        run: |
          sed -i 's|</body>|<script src="exam-science-lab-banks.js?v=${{ github.sha }}"></script></body>|' index.html

      - name: Enable homepage branding
        run: |
          sed -i 's|</body>|<script src="exam-branding.js?v=${{ github.sha }}"></script></body>|' index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
