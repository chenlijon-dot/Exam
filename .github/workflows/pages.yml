name: Deploy quiz to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Inject exam modules
        run: sed -i 's#</body>#<script src="exam-option-randomizer.js?v=20260912-1"></script><script src="exam-records.js?v=20260912-2"></script><script src="exam-wrong-ui.js?v=20260912-1"></script><script src="exam-records-clear.js?v=20260912-3"></script><script src="exam-gpt-analysis.js?v=20260912-3"></script><script src="exam-catalog.js?v=20260912-1"></script></body>#' index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
