name: Deploy quiz to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stamp build version
        run: sed -i 's/__BUILD_SHA__/${{ github.sha }}/g' index.html

      - name: Stamp homepage version timestamp
        run: |
          BUILD_TS="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          sed -i "s|__BUILD_TIMESTAMP__|${BUILD_TS}|g" exam-branding.js

      - name: Build plain GEPT vocabulary data
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import json
          import os
          import re
          import string

          base = Path('chapter-bank/english/gept/elementary/vocabulary')
          parts = []
          for i in (1, 2, 3):
              path = base / f'gept-beginner-vocabulary.b64.part{i}.txt'
              text = path.read_text(encoding='utf-8').lstrip('\ufeff')
              text = re.sub(r'[^A-Za-z0-9+/=]', '', text)
              if len(text) < 100:
                  raise SystemExit(f'Vocabulary part {i} is unexpectedly short: {len(text)}')
              parts.append(text)

          # The historical split files are each one character short at the first two
          # boundaries (19999/19999/18548 bytes). Recover those two Base64 characters
          # once during deployment, then publish only plain JavaScript rows to browsers.
          alphabet = string.ascii_uppercase + string.ascii_lowercase + string.digits + '+/'
          recovered = None
          rows = None
          for a in alphabet:
              for b in alphabet:
                  encoded = parts[0] + a + parts[1] + b + parts[2]
                  try:
                      raw = base64.b64decode(encoded, validate=True)
                      if raw[:2] != b'\x1f\x8b':
                          continue
                      payload = gzip.decompress(raw).decode('utf-8')
                      candidate = json.loads(payload)
                      if isinstance(candidate, list) and candidate:
                          recovered = a + b
                          rows = candidate
                          break
                  except Exception:
                      continue
              if rows:
                  break

          if not rows:
              raise SystemExit('Unable to recover the two missing Base64 boundary characters')

          valid_rows = [row for row in rows if row.get('id') and row.get('w') and row.get('n') and row.get('c')]
          if len(valid_rows) < 2000:
              raise SystemExit(f'Vocabulary row count is unexpectedly low: {len(valid_rows)}')

          data_js = (
              'window.__GEPT_VOCAB_ROWS=' + json.dumps(valid_rows, ensure_ascii=False, separators=(',', ':')) + ';\n'
              + 'window.__GEPT_VOCAB_DATA_BUILD=' + json.dumps(os.environ.get('BUILD_SHA', 'unknown')) + ';\n'
          )

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          marker = '<script id="geptVocabularyData">\n' + data_js + '</script>\n'
          if '</body>' not in html:
              raise SystemExit('index.html has no </body> marker')
          html = html.replace('</body>', marker + '</body>', 1)
          index.write_text(html, encoding='utf-8')

          print(f'Recovered missing Base64 chars: {recovered}')
          print(f'Embedded {len(valid_rows)} plain GEPT vocabulary rows into index.html')
          PY

      - name: Prevent legacy start-screen flash
        run: |
          sed -i 's|<section id="startScreen">|<section id="startScreen" class="hidden">|' index.html

      - name: Enable homepage branding
        run: |
          sed -i 's|</body>|<script src="exam-branding.js?v=${{ github.sha }}"></script></body>|' index.html

      - name: Enable in-app browser history
        run: |
          sed -i 's|</body>|<script src="exam-browser-history.js?v=${{ github.sha }}"></script></body>|' index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
