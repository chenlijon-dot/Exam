name: Deploy quiz to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stamp build version
        run: sed -i 's/__BUILD_SHA__/${{ github.sha }}/g' index.html

      - name: Stamp homepage version timestamp
        run: |
          BUILD_TS="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          sed -i "s|__BUILD_TIMESTAMP__|${BUILD_TS}|g" exam-branding.js

      - name: Build and inline GEPT vocabulary payload
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, os

          base = Path('chapter-bank/english/gept/elementary/vocabulary')
          parts = []
          for i in (1, 2, 3):
              p = base / f'gept-beginner-vocabulary.b64.part{i}.txt'
              text = p.read_text(encoding='utf-8').lstrip('\ufeff').strip()
              if len(text) < 100:
                  raise SystemExit(f'Vocabulary part {i} is unexpectedly short: {len(text)}')
              parts.append(text)

          payload = (
              'window.__GEPT_VOCAB_PARTS=' + json.dumps(parts, ensure_ascii=False) + ';\n'
              + 'window.__GEPT_VOCAB_EMBEDDED_BUILD=' + json.dumps(os.environ.get('BUILD_SHA', 'unknown')) + ';\n'
          )

          out = base / 'gept-beginner-vocabulary-embedded.js'
          out.write_text(payload, encoding='utf-8')

          # Put the payload directly in the deployed HTML before any runtime module.
          # This removes Android/browser/network dependency from vocabulary startup.
          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          marker = '<script id="geptVocabularyInlinePayload">\n' + payload + '</script>\n'
          if '</body>' not in html:
              raise SystemExit('index.html has no </body> marker')
          html = html.replace('</body>', marker + '</body>', 1)
          index.write_text(html, encoding='utf-8')
          print(f'Embedded GEPT vocabulary directly into index.html; part lengths {[len(x) for x in parts]}')
          PY

      - name: Prevent legacy start-screen flash
        run: |
          sed -i 's|<section id="startScreen">|<section id="startScreen" class="hidden">|' index.html

      - name: Enable homepage branding
        run: |
          sed -i 's|</body>|<script src="exam-branding.js?v=${{ github.sha }}"></script></body>|' index.html

      - name: Enable in-app browser history
        run: |
          sed -i 's|</body>|<script src="exam-browser-history.js?v=${{ github.sha }}"></script></body>|' index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
