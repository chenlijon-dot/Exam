name: Update README versioning once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-readme-versioning-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch README
        run: python3 .github/scripts/patch_readme_versioning.py

      - name: Commit README
        run: |
          git config user.name "Exam README Updater"
          git config user.email "actions@users.noreply.github.com"
          git add README.md
          git commit -m "Document homepage versioning policy"
          git push
