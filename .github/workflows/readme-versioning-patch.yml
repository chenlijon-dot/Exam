name: Patch README versioning documentation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/readme-versioning-patch.yml'

permissions:
  contents: write

jobs:
  patch-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update README
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')

          text = text.replace('> 最後更新：2026-09-14', '> 最後更新：2026-09-15', 1)

          old = '''# 2. 目前網站主入口

```text
國中題庫
│'''
          new = '''# 2. 目前網站主入口

目前首頁正式品牌名稱：

```text
國中全科學習題庫
章節練習・各校段考・歷屆試題
作者：Chris醫師
版本：YYYY-MM-DD HH:MM
```

其中「版本」不是手動填寫的固定字串，而是每次 GitHub Pages 部署時，以 `Asia/Taipei` 時區自動產生的部署時間戳記。這樣手機或電腦看到網站時，可以直接確認目前載入的是哪一次部署版本。

主入口樹：

```text
國中全科學習題庫
│'''
          if old not in text:
              raise SystemExit('README section 2 anchor not found')
          text = text.replace(old, new, 1)

          anchor = '''GitHub 同步屬於全站設定，不重複放在每一個章節。

---

# 3. 題目來源分類'''
          replacement = '''GitHub 同步屬於全站設定，不重複放在每一個章節。

## 2.1 首頁品牌與版本規則

首頁品牌由：

```text
exam-branding.js
```

負責顯示，目前固定內容為：

```text
名稱：國中全科學習題庫
副標：章節練習・各校段考・歷屆試題
作者：Chris醫師
```

版本時間戳由 GitHub Pages workflow：

```text
.github/workflows/pages.yml
```

在部署時自動將 `__BUILD_TIMESTAMP__` 替換為：

```text
YYYY-MM-DD HH:MM
```

時區固定：

```text
Asia/Taipei
```

版本使用原則：

- 每一次 GitHub Pages deployment 都產生新的時間戳記。
- 網站 UI 問題回報時，優先附上首頁顯示的版本時間，可快速判斷是否仍在看舊版快取。
- README 的「最後更新」代表文件內容最後整理日期；首頁的「版本」代表目前網站 deployment，兩者意義不同。
- 目前以部署時間戳作為輕量版本識別；若未來需要正式 release，可再另外加入 semantic version / Git tag，不取代此部署時間戳。
- 修改首頁品牌、版本格式或部署規則後，必須同步更新本 README。

---

# 3. 題目來源分類'''
          if anchor not in text:
              raise SystemExit('README section 2.1 anchor not found')
          text = text.replace(anchor, replacement, 1)

          text = text.replace('''├─ exam-record-layout.js
│
├─ chapter-bank/''', '''├─ exam-record-layout.js
├─ exam-branding.js
│  └─ 首頁名稱、作者與版本資訊
├─ exam-browser-history.js
│  └─ 手機／瀏覽器返回鍵的站內上一層導航
│
├─ chapter-bank/''', 1)

          progress_anchor = '''- [x] 五科 + 歷屆考題主入口
- [x] GitHub 同步設定移到全站主選單'''
          progress_replacement = '''- [x] 五科 + 歷屆考題主入口
- [x] 首頁品牌更新為「國中全科學習題庫」
- [x] 首頁顯示作者 `Chris醫師`
- [x] 首頁顯示 GitHub Pages deployment 時間戳版本（Asia/Taipei）
- [x] 手機／瀏覽器系統返回鍵支援站內逐層返回
- [x] GitHub 同步設定移到全站主選單'''
          if progress_anchor not in text:
              raise SystemExit('README progress anchor not found')
          text = text.replace(progress_anchor, progress_replacement, 1)

          handoff_anchor = '''12. 預設直接使用 GitHub connector 修改文字檔；binary／批次處理才回 `E:\\Exam`。
13. 每完成新教材 canonical、新章節、新段考批次、新歷屆試卷或重大架構調整，都更新 README。'''
          handoff_replacement = '''12. 預設直接使用 GitHub connector 修改文字檔；binary／批次處理才回 `E:\\Exam`。
13. 若使用者回報網站 UI／手機顯示問題，先確認首頁顯示的「版本時間戳」，以判斷是否為舊快取或舊 deployment。
14. 首頁版本時間戳代表網站 deployment；README 最後更新日期代表文件維護日期，不要混為同一版本號。
15. 每完成新教材 canonical、新章節、新段考批次、新歷屆試卷、網站重大功能或首頁／版本規則調整，都更新 README。'''
          if handoff_anchor not in text:
              raise SystemExit('README handoff anchor not found')
          text = text.replace(handoff_anchor, handoff_replacement, 1)

          text = text.replace('截至 2026-09-14：', '截至 2026-09-15：', 1)

          old_status = '''> 本專案已正式採用「Google Drive 原始教材與 canonical 教材知識庫 → GitHub Exam 結構化可作答題庫 → Private Exam-Record 學習紀錄與 AI curriculum」三層架構。'''
          new_status = '''> 本專案已正式採用「Google Drive 原始教材與 canonical 教材知識庫 → GitHub Exam 結構化可作答題庫 → Private Exam-Record 學習紀錄與 AI curriculum」三層架構。網站首頁現已使用「國中全科學習題庫」品牌，顯示作者 Chris醫師，並以每次 GitHub Pages 部署的台灣時間戳作為目前網站版本識別；手機／瀏覽器返回鍵亦已納入站內逐層導航。'''
          if old_status not in text:
              raise SystemExit('README status anchor not found')
          text = text.replace(old_status, new_status, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit README
        run: |
          git config user.name 'Exam README Updater'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md
          if git diff --cached --quiet; then
            echo 'No README changes.'
            exit 0
          fi
          git commit -m 'Document homepage branding and version timestamp'
          git push
