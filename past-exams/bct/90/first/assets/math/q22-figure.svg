<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
<rect width="1200" height="430" fill="white"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2fc4d0"/></marker></defs>
<g font-family="serif" fill="#333">
  <text x="22" y="223" font-size="34">入口</text>
  <rect x="130" y="135" width="320" height="145" fill="white" stroke="#222" stroke-width="3"/>
  <text x="290" y="190" text-anchor="middle" font-size="32">2x(x+2)=5x+7</text>
  <text x="290" y="240" text-anchor="middle" font-size="28">是否為一元二次方程式？</text>

  <rect x="590" y="50" width="360" height="130" fill="white" stroke="#222" stroke-width="3"/>
  <text x="770" y="100" text-anchor="middle" font-size="32">4x+3y=7</text>
  <text x="770" y="145" text-anchor="middle" font-size="28">是否為二元一次方程式？</text>

  <rect x="590" y="250" width="360" height="130" fill="white" stroke="#222" stroke-width="3"/>
  <text x="770" y="300" text-anchor="middle" font-size="32">4x+3y=7</text>
  <text x="770" y="345" text-anchor="middle" font-size="28">是否為二元一次方程式？</text>

  <g stroke="#2fc4d0" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <path d="M70 210 H125"/>
    <path d="M450 185 L585 110"/>
    <path d="M450 235 L585 315"/>
    <path d="M950 95 L1060 65"/>
    <path d="M950 135 L1060 165"/>
    <path d="M950 295 L1060 265"/>
    <path d="M950 335 L1060 365"/>
  </g>
  <g font-size="26">
    <text x="505" y="135">是</text><text x="505" y="305">否</text>
    <text x="970" y="68">是</text><text x="970" y="165">否</text>
    <text x="970" y="268">是</text><text x="970" y="365">否</text>
  </g>
  <g font-size="40"><text x="1080" y="78">甲</text><text x="1080" y="178">乙</text><text x="1080" y="278">丙</text><text x="1080" y="378">丁</text></g>
</g>
</svg>