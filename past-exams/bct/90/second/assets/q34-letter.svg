<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" role="img" aria-labelledby="t d">
<title id="t">第34題書信格式</title><desc id="d">文風寫給雙親的書信，畫線處為鈞鑒、足下、大安、叩上</desc>
<rect x="14" y="14" width="1072" height="442" fill="white" stroke="#333" stroke-width="4"/>
<g stroke="#a8a8a8" stroke-width="2"><line x1="70" y1="98" x2="1030" y2="98"/><line x1="70" y1="164" x2="1030" y2="164"/><line x1="70" y1="230" x2="1030" y2="230"/><line x1="70" y1="296" x2="1030" y2="296"/><line x1="70" y1="362" x2="1030" y2="362"/><line x1="70" y1="428" x2="1030" y2="428"/></g>
<g font-family="serif" fill="#111" font-size="31"><text x="75" y="78">父母親大人</text><text x="285" y="78" text-decoration="underline">鈞鑒</text><text x="365" y="78">：八月二十五日拜別</text><text x="770" y="78" text-decoration="underline">足下</text><text x="850" y="78">，乘車抵達學校，</text><text x="75" y="144">隨即辦理入學手續，並住進第一宿舍二○三室，一切均安，</text><text x="75" y="210">懇釋　慈念。敬祝</text><text x="75" y="276" text-decoration="underline">大安</text><text x="650" y="350">兒</text><text x="700" y="410">文風</text><text x="780" y="410" text-decoration="underline">叩上</text><text x="880" y="410">　八月二十六日</text></g></svg>
