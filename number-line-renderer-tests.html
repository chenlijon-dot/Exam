<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Math Diagram Renderer Tests</title>
  <style>
    body{margin:0;background:#f6f8fb;color:#172033;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}
    main{max-width:900px;margin:auto;padding:20px 14px 60px}
    h1{margin:0 0 8px}
    .case{background:#fff;border:1px solid #dfe5ee;border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 4px 14px rgba(15,23,42,.04)}
    .case h2{font-size:1rem;margin:0 0 8px}
    code{background:#eef2f7;border-radius:6px;padding:2px 5px}
  </style>
</head>
<body>
<main>
  <h1>Math Diagram Renderer</h1>
  <p>數線、三角形、正方形、圓形與 XY 座標平面 smoke tests。</p>
  <div id="cases"></div>
</main>
<script src="exam-diagram-renderer.js"></script>
<script>
const CASES = [
  {
    title:'Case 1｜基本讀值',
    spec:{type:'number-line',min:-5,max:5,tickStep:1,showNumberLabels:true,showArrows:true,points:[{x:-3,label:'A',style:'solid'}]}
  },
  {
    title:'Case 2｜兩點距離',
    spec:{type:'number-line',min:-6,max:6,tickStep:1,points:[{x:-4,label:'A',style:'solid'},{x:3,label:'B',style:'solid'}]}
  },
  {
    title:'Case 3｜大範圍與 tickStep=2',
    spec:{type:'number-line',min:-20,max:20,tickStep:2,points:[{x:-10,label:'P',style:'solid'},{x:10,label:'Q',style:'solid'}]}
  },
  {
    title:'Case 4｜三角形頂點標註',
    spec:{type:'triangle',vertices:[{x:0,y:0,label:'A'},{x:5,y:0,label:'B'},{x:2,y:4,label:'C'}]}
  },
  {
    title:'Case 5｜正方形頂點標註',
    spec:{type:'square',x:0,y:0,size:4,showVertexLabels:true}
  },
  {
    title:'Case 6｜圓形、圓心與圓周點',
    spec:{type:'circle',center:{x:0,y:0,label:'O'},radius:4,points:[{x:4,y:0,label:'A'},{x:0,y:4,label:'B'}]}
  },
  {
    title:'Case 7｜XY 座標平面與標記點',
    spec:{type:'coordinate-plane',xMin:-5,xMax:5,yMin:-5,yMax:5,tickStep:1,points:[{x:-3,y:2,label:'A'},{x:2,y:-2,label:'B'}]}
  },
  {
    title:'Case 8｜XY 平面線段',
    spec:{type:'xy-plane',xMin:-6,xMax:6,yMin:-4,yMax:4,tickStep:1,points:[{x:-4,y:-2,label:'P'},{x:4,y:2,label:'Q'}],segments:[{from:{x:-4,y:-2},to:{x:4,y:2}}]}
  },
  {
    title:'Case 9｜空心點與多點數線',
    spec:{type:'number-line',min:-4,max:4,tickStep:1,points:[{x:-2,label:'A',showValue:true,style:'solid'},{x:0,label:'O',showValue:true,style:'hollow'},{x:3,label:'B',showValue:true,style:'solid'}]}
  },
  {
    title:'Case 10｜正方體 3D 投影',
    spec:{type:'solid-projection',solid:'cube',size:4,view:{yaw:38,pitch:28,roll:0,projection:'orthographic'},showVertexLabels:true,showHiddenEdges:true,showAxes:false}
  },
  {
    title:'Case 11｜長方體斜投影',
    spec:{type:'solid-projection',solid:'cuboid',width:5,height:3,depth:4,view:{yaw:30,pitch:22,roll:0,projection:'oblique'},showVertexLabels:true,showHiddenEdges:true,showAxes:false}
  },
  {
    title:'Case 12｜正方體 + XYZ 空間方向軸',
    spec:{type:'solid-projection',solid:'cube',size:4,view:{yaw:38,pitch:28,roll:0,projection:'orthographic'},showVertexLabels:true,showHiddenEdges:true,showAxes:true}
  },
  {
    title:'Case 13｜自訂三角柱',
    spec:{
      type:'solid-projection',
      solid:'custom',
      vertices:{
        A:{x:0,y:0,z:0},
        B:{x:4,y:0,z:0},
        C:{x:2,y:3,z:0},
        D:{x:0,y:0,z:4},
        E:{x:4,y:0,z:4},
        F:{x:2,y:3,z:4}
      },
      edges:[
        ['A','B'],['B','C'],['C','A'],
        ['D','E'],['E','F'],['F','D'],
        ['A','D'],['B','E'],['C','F']
      ],
      faces:[
        ['A','B','C'],
        ['D','F','E'],
        ['A','D','E','B'],
        ['B','E','F','C'],
        ['C','F','D','A']
      ],
      view:{yaw:38,pitch:25,roll:0,projection:'orthographic'},
      showVertexLabels:true,
      showHiddenEdges:true,
      showAxes:false
    }
  },
  {
    title:'Case 14｜自訂四角錐',
    spec:{
      type:'solid-projection',
      solid:'custom',
      vertices:{
        A:{x:0,y:0,z:0},
        B:{x:4,y:0,z:0},
        C:{x:4,y:4,z:0},
        D:{x:0,y:4,z:0},
        E:{x:2,y:2,z:4}
      },
      edges:[
        ['A','B'],['B','C'],['C','D'],['D','A'],
        ['A','E'],['B','E'],['C','E'],['D','E']
      ],
      faces:[
        ['A','D','C','B'],
        ['A','B','E'],
        ['B','C','E'],
        ['C','D','E'],
        ['D','A','E']
      ],
      view:{yaw:42,pitch:28,roll:0,projection:'orthographic'},
      showVertexLabels:true,
      showHiddenEdges:true,
      showAxes:false
    }
  }
]

const root=document.getElementById('cases');
CASES.forEach((item,index)=>{
  const section=document.createElement('section');
  section.className='case';
  section.innerHTML=`<h2>${item.title}</h2><div id="case-${index}"></div>`;
  root.appendChild(section);
  renderDiagram(section.querySelector(`#case-${index}`),item.spec);
});
</script>
</body>
</html>
