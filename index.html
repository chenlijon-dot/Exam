<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f172a" />
  <title>科學方法模擬考｜難易度選擇</title>
  <style>
    :root{--bg:#f6f8fb;--card:#fff;--ink:#172033;--muted:#657089;--line:#dfe5ee;--brand:#2563eb;--ok:#15803d;--bad:#b91c1c;--soft:#eef4ff}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65}
    .wrap{max-width:840px;margin:auto;padding:18px 14px 70px}
    header{background:linear-gradient(135deg,#172554,#1d4ed8);color:#fff;border-radius:20px;padding:24px 20px;margin-bottom:16px;box-shadow:0 10px 28px rgba(15,23,42,.14)}
    h1{font-size:1.65rem;margin:0 0 4px} h2{margin:0 0 8px}
    header p{margin:0;opacity:.9}
    .status{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
    .pill{background:rgba(255,255,255,.14);padding:6px 10px;border-radius:999px;font-size:.92rem}
    .panel,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 14px rgba(15,23,42,.04)}
    .panel{padding:22px;margin:14px 0}.card{padding:18px;margin:12px 0}
    .difficulty-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
    .difficulty{border:2px solid var(--line);background:#fff;border-radius:16px;padding:18px 14px;text-align:left;cursor:pointer;transition:.16s;min-height:150px}
    .difficulty:hover{transform:translateY(-2px);border-color:#93b4fb;box-shadow:0 7px 20px rgba(37,99,235,.1)}
    .difficulty strong{display:block;font-size:1.25rem;margin-bottom:5px}.difficulty span{display:block;color:var(--muted);font-size:.94rem}
    .easy strong{color:#15803d}.medium strong{color:#b45309}.hard strong{color:#b91c1c}
    .qtitle{font-weight:750;margin-bottom:12px}.num{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--brand);margin-right:8px}
    label.option{display:block;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin:8px 0;cursor:pointer;transition:.15s;background:#fff}
    label.option:hover{border-color:#9db9fb;background:#f8fbff}label.option:has(input:checked){border-color:var(--brand);background:#eff6ff}
    input[type=radio]{margin-right:8px;transform:scale(1.12)}
    .correct{border-color:#86efac!important;background:#f0fdf4!important}.wrong{border-color:#fca5a5!important;background:#fef2f2!important}
    .explain{display:none;margin-top:10px;padding:10px 12px;border-left:4px solid #93c5fd;background:#f8fbff;border-radius:8px;color:#334155}.explain.show{display:block}
    .actions{position:sticky;bottom:0;background:rgba(246,248,251,.94);backdrop-filter:blur(10px);padding:12px 0 4px;display:flex;gap:10px;flex-wrap:wrap;z-index:5}
    button{border:0;border-radius:12px;padding:11px 16px;font-size:1rem;font-weight:700;cursor:pointer}.primary{background:var(--brand);color:white;flex:1;min-width:160px}.secondary{background:#e2e8f0;color:#1e293b}
    #result{display:none;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0;text-align:center}#result strong{font-size:1.9rem;color:var(--brand)}
    .tiny{font-size:.9rem;color:var(--muted)}.hidden{display:none!important}.center{text-align:center}
    @media(max-width:620px){.difficulty-grid{grid-template-columns:1fr}.difficulty{min-height:auto}h1{font-size:1.38rem}.card{padding:15px}.wrap{padding-left:10px;padding-right:10px}}
  </style>
</head>
<body>
<div class="wrap">
  <section id="startScreen">
    <header><h1>科學方法模擬考</h1><p>國一自然｜選擇難易程度後開始作答</p></header>
    <div class="panel">
      <h2 class="center">請選擇難易程度</h2>
      <p class="center tiny">每個難度 20 題，每題 5 分，滿分 100 分。</p>
      <div class="difficulty-grid">
        <button class="difficulty easy" onclick="startExam('easy')"><strong>簡易</strong><span>基本觀念、科學方法步驟、簡單變因判讀。</span></button>
        <button class="difficulty medium" onclick="startExam('medium')"><strong>中等</strong><span>情境應用、實驗組與對照組、變因與結果判讀。</span></button>
        <button class="difficulty hard" onclick="startExam('hard')"><strong>困難</strong><span>資料判讀、實驗缺陷、控制變因與結論有效性。</span></button>
      </div>
    </div>
  </section>

  <section id="examScreen" class="hidden">
    <header>
      <h1 id="examTitle">科學方法模擬考</h1>
      <p id="examSub">20 題選擇題</p>
      <div class="status"><span class="pill" id="progress">已作答 0 / 20</span><span class="pill">每題 5 分</span><span class="pill">滿分 100 分</span></div>
    </header>
    <div id="result"></div>
    <main id="quiz"></main>
    <div class="actions">
      <button class="primary" id="submitBtn">交卷看成績</button>
      <button class="secondary" id="explainBtn">顯示詳解</button>
      <button class="secondary" id="restartBtn">重新作答</button>
      <button class="secondary" id="backBtn">選擇其他難度</button>
    </div>
    <p class="tiny">交卷後，綠色為正確答案，紅色為本次選錯的答案。</p>
  </section>
</div>
<script>
const banks={
 easy:[
  {q:'小明看到豆苗朝向窗戶生長，這個步驟屬於科學方法中的哪一項？',o:['觀察','提出假說','設計實驗','下結論'],a:0,e:'先看到並記錄自然現象，屬於觀察。'},
  {q:'「植物為什麼會朝向光源生長？」這句話屬於哪一個步驟？',o:['提出問題','實驗結果','結論','分析資料'],a:0,e:'把觀察到的現象轉成疑問，就是提出問題。'},
  {q:'「我猜植物會朝光線較強的方向生長。」這句話最接近什麼？',o:['假說','結論','觀察','數據'],a:0,e:'實驗前對問題提出可驗證的推測，稱為假說。'},
  {q:'若要研究水溫是否影響水草產生氧氣的量，研究者主動改變的是什麼？',o:['水溫','水草種類','水量','氧氣量'],a:0,e:'研究者刻意改變的因素稱為操縱變因，本題是水溫。'},
  {q:'承上題，實驗最後測量氧氣產生量，氧氣產生量屬於什麼？',o:['操縱變因','應變變因','控制變因','對照組'],a:1,e:'最後觀察或測量的結果稱為應變變因。'},
  {q:'研究光照對植物生長的影響時，植物種類應如何處理？',o:['每組不同','保持相同','隨機更換','不必理會'],a:1,e:'不是研究重點的條件應盡量保持相同。'},
  {q:'科學實驗設置對照組的主要目的為何？',o:['增加題目難度','提供比較基準','改變更多條件','讓結果一定正確'],a:1,e:'對照組用來和實驗組比較。'},
  {q:'如果實驗結果不符合原本假說，應該怎麼做？',o:['修改數據','檢討或修改假說','刪除結果','堅持假說一定正確'],a:1,e:'應忠實面對實驗結果，必要時修改假說或重新設計實驗。'},
  {q:'下列哪一個順序較合理？',o:['觀察→提出問題→提出假說→實驗','結論→實驗→問題→觀察','假說→結論→觀察→實驗','實驗→結論→觀察→問題'],a:0,e:'科學探究通常由觀察開始，再提出問題與假說並進行實驗。'},
  {q:'小華每天量豆苗高度並寫在表格中，這是在做什麼？',o:['提出問題','蒐集資料','修改假說','製造結果'],a:1,e:'實際測量並記錄屬於蒐集實驗資料。'},
  {q:'實驗完成後比較甲、乙兩組數據，主要是在做什麼？',o:['分析結果','提出問題','準備器材','形成觀察'],a:0,e:'比較各組資料屬於分析結果。'},
  {q:'小明把同一個實驗重複做三次，主要有什麼好處？',o:['增加可靠性','保證假說正確','可以不記錄','可以改更多條件'],a:0,e:'重複實驗可以降低偶然因素造成的影響。'},
  {q:'下列何者最像實驗數據？',o:['植物好像喜歡陽光','第5天豆苗高12公分','我猜它會長高','為什麼它會長高'],a:1,e:'數據是實際測量或記錄得到的資料。'},
  {q:'若研究肥料是否影響植物高度，最適合主動改變哪一項？',o:['肥料有無','植物種類','花盆大小','測量方式'],a:0,e:'研究肥料的效果，就以肥料有無或種類作為操縱變因。'},
  {q:'若研究日照時間是否影響植物生長，最後量植物高度，植物高度是什麼？',o:['應變變因','操縱變因','控制變因','對照條件'],a:0,e:'植物高度是受到日照時間影響而被測量的結果。'},
  {q:'兩組實驗只讓水量不同，其他條件都相同，這樣做主要是為了什麼？',o:['方便判斷水量的影響','讓植物一定長一樣','增加變因','省略觀察'],a:0,e:'只改一個主要條件，才能較清楚判斷它是否造成差異。'},
  {q:'「在相同條件下，加肥料的植物平均較高。」這句話若來自實驗結果，最接近什麼？',o:['結論','提出問題','假說','觀察前的猜測'],a:0,e:'依實驗資料整理出的判斷可形成結論。'},
  {q:'下列何者屬於控制變因？研究水溫對水草產氧量的影響時：',o:['水溫','產生的氧氣量','水草種類','實驗結論'],a:2,e:'水草種類不是研究重點，因此應保持相同，屬於控制變因。'},
  {q:'一個好的科學假說最重要的特點是什麼？',o:['無法測試','可以用實驗驗證','一定要很複雜','一定要和結論相同'],a:1,e:'科學假說必須能被觀察或實驗檢驗。'},
  {q:'下列哪一項最能提高實驗結果的可信度？',o:['只做一次','重複實驗並取得相近結果','改變很多條件','只挑喜歡的數據'],a:1,e:'重複實驗且得到相近結果，可提高結果的可靠性。'}
 ],
 medium:[
  {q:'小明想知道光線強弱是否影響豆苗高度。他準備兩盆同種豆苗，一盆放窗邊、一盆放較暗處，其他條件相同。這個實驗的操縱變因是？',o:['豆苗高度','光線強弱','豆苗種類','澆水量'],a:1,e:'研究者刻意改變的是光線強弱。'},
  {q:'承上題，豆苗高度屬於什麼？',o:['操縱變因','應變變因','控制變因','對照條件'],a:1,e:'豆苗高度是實驗最後測量的結果，因此是應變變因。'},
  {q:'研究肥料對植物生長的影響時，甲組施肥、乙組不施肥，兩組都用同種植物、相同水量與日照。乙組主要扮演什麼角色？',o:['實驗組','對照組','操縱變因','應變變因'],a:1,e:'不接受處理的組別可作為比較基準，即對照組。'},
  {q:'某學生想研究「音樂是否影響讀書效率」，讓甲組在音樂中讀書、乙組安靜讀書，但甲組讀英文、乙組讀數學。最大的問題是什麼？',o:['沒有測驗','同時改變了不只一個條件','沒有音樂','沒有學生'],a:1,e:'除了音樂之外，讀書科目也不同，無法判斷結果到底由哪一項造成。'},
  {q:'若實驗所得資料和假說不一致，最合理的作法是？',o:['只保留符合假說的資料','重新檢查假說與實驗設計','改寫實驗結果','直接宣稱假說正確'],a:1,e:'科學探究應依證據修正假說或實驗，而不是修改資料。'},
  {q:'研究「溫度是否影響酵母發酵速度」時，下列何者最適合作為應變變因？',o:['培養溫度','酵母種類','產生氣體的體積','糖水濃度'],a:2,e:'發酵速度可由單位時間產生的氣體量等指標測量。'},
  {q:'學生把四組植物放在不同光照時間下，記錄兩週後高度。除了光照時間，最應保持一致的是？',o:['植物種類、土壤與水量','每盆高度都不同','每盆肥料隨意添加','每組測量時間不同'],a:0,e:'非研究重點的條件應一致，才能公平比較。'},
  {q:'「如果增加光照時間，豆苗會長得更高。」此敘述若在實驗前提出，屬於？',o:['假說','觀察結果','結論','控制變因'],a:0,e:'實驗前可被驗證的預測屬於假說。'},
  {q:'下列何種作法最能降低單一個體差異對結果的影響？',o:['每組只用一株','每組增加樣本數','只做最漂亮的植物','測一次就停止'],a:1,e:'增加樣本數可減少個別差異造成的偶然影響。'},
  {q:'某實驗記錄「甲組平均12.4公分、乙組平均8.1公分」。這屬於？',o:['定量資料','假說','提出問題','控制變因'],a:0,e:'以數值表示的測量結果屬於定量資料。'},
  {q:'某學生觀察到「甲組葉色較深、乙組葉色較淡」，這較屬於哪種資料？',o:['定性資料','定量資料','操縱變因','假說'],a:0,e:'以外觀、顏色等性質描述，屬於定性資料。'},
  {q:'為什麼科學家常將實驗結果畫成圖表？',o:['讓結果更難看懂','方便比較與看出趨勢','讓數字變大','避免分析'],a:1,e:'圖表能幫助快速比較資料並辨認趨勢。'},
  {q:'研究「鹽分是否影響種子發芽率」，甲組0%鹽水、乙組1%、丙組2%、丁組3%。這裡0%鹽水組最適合視為？',o:['對照組','應變變因','控制變因','結論'],a:0,e:'沒有鹽分處理的0%組可作為基準。'},
  {q:'如果實驗只量一次植物高度，而測量時尺放歪，結果可能受到什麼影響？',o:['測量誤差','假說必定錯誤','操縱變因消失','對照組增加'],a:0,e:'尺的位置不正確會造成測量誤差。'},
  {q:'下列哪一項最符合公平測試（fair test）的原則？',o:['一次改變一個主要變因','同時改變三個條件','各組使用完全不同材料','只觀察符合預期的組別'],a:0,e:'公平測試通常一次只改變一個主要條件，其餘盡量相同。'},
  {q:'小芳做了三次相同實驗，結果分別為10、11、10.5。重複結果相近，較能表示？',o:['結果有一定再現性','假說永遠正確','沒有任何誤差','控制變因不需要'],a:0,e:'多次結果接近，代表實驗具有較好的重現性與可靠性。'},
  {q:'若資料顯示肥料越多植物反而越矮，最合理的結論是？',o:['在本實驗條件下，較多肥料可能抑制生長','植物一定不需要肥料','所有肥料都有毒','資料必須刪除'],a:0,e:'結論應限制在實驗條件與資料能支持的範圍內。'},
  {q:'同學說：「甲組平均較高，所以每一株甲組植物一定都比乙組高。」這個說法有何問題？',o:['平均值不能代表每個個體都如此','平均值永遠不能用','應變變因不能測','實驗組不能比較'],a:0,e:'平均值描述整體趨勢，不表示每個個體都符合。'},
  {q:'實驗報告中將原始數據、平均值與圖表都保存，主要好處是？',o:['方便別人檢查與理解','讓報告更長','避免重複實驗','使假說一定正確'],a:0,e:'完整紀錄有助於檢查、重現與判讀實驗。'},
  {q:'若不同研究者使用相同方法得到類似結果，這最能增強什麼？',o:['結果的可信度','題目的難度','操縱變因數量','主觀印象'],a:0,e:'不同研究者能得到相似結果，表示結果較具可重現性與可信度。'}
 ],
 hard:[
  {q:'研究者比較甲、乙兩種肥料，甲組放陽台、乙組放室內，最後甲組長得較高。為何不能直接說甲肥料較好？',o:['還有光照環境不同','植物不能測高度','沒有使用肥料','高度不是資料'],a:0,e:'肥料種類和光照環境同時不同，存在混淆變因。'},
  {q:'某研究宣稱飲料X能提高記憶力，實驗組喝X，對照組什麼都不喝，而且受試者知道自己在哪一組。下列哪個改進最合理？',o:['給對照組外觀相同但無有效成分的飲料','取消對照組','只留下效果最好的人','讓實驗組多睡一小時'],a:0,e:'使用安慰劑有助控制期待效應，使比較更公平。'},
  {q:'為什麼樣本數太少時，實驗結論較不可靠？',o:['個體差異容易造成較大影響','樣本少一定沒有數據','操縱變因會消失','所有平均值都錯'],a:0,e:'樣本太少時，偶然個體差異可能嚴重影響整體結果。'},
  {q:'甲組平均20公分、乙組平均19.8公分。若測量誤差約±1公分，最謹慎的判斷是？',o:['兩組差異可能不足以支持明確效果','甲組一定較高','乙組一定較高','測量誤差與結論無關'],a:0,e:'兩組差距小於可能的測量誤差，不能過度解讀差異。'},

  {q:'下列何者最可能造成系統性誤差？',o:['每次都使用校正錯誤、固定多量2公分的尺','偶爾看錯一次刻度','某一株植物突然被蟲咬','隨機抽樣'],a:0,e:'工具固定偏差會使所有測量朝同一方向偏移，屬於系統性誤差。'},

  {q:'研究「運動是否提高反應速度」，實驗組接受訓練、對照組不訓練。若實驗組平均年齡20歲、對照組平均65歲，主要問題是？',o:['年齡可能是混淆變因','年齡是應變變因','沒有操縱變因','反應速度不能測'],a:0,e:'兩組年齡差異本身就可能影響反應速度，會干擾訓練效果的判斷。'},

  {q:'同一份資料，用不同縱軸比例畫圖可能讓差異看起來非常不同。這提醒我們？',o:['判讀圖表時要注意刻度與尺度','圖表都不可信','數據可以任意修改','只看圖不要看數字'],a:0,e:'圖表呈現方式會影響視覺印象，應檢查坐標軸與尺度。'},

const letters=['A','B','C','D']; const names={easy:'簡易',medium:'中等',hard:'困難'}; let level=null,questions=[],graded=false;
const startScreen=document.getElementById('startScreen'),examScreen=document.getElementById('examScreen'),quiz=document.getElementById('quiz'),result=document.getElementById('result');
function startExam(selected){
 level=selected; questions=banks[level]; graded=false;
 startScreen.classList.add('hidden'); examScreen.classList.remove('hidden');
 document.getElementById('examTitle').textContent=`科學方法模擬考｜${names[level]}`;
 document.getElementById('examSub').textContent=`${names[level]}程度｜20 題選擇題`;
 render(); result.style.display='none'; document.getElementById('explainBtn').textContent='顯示詳解';
 window.scrollTo({top:0,behavior:'smooth'});
}
function render(){
 quiz.innerHTML=questions.map((x,i)=>`<section class="card" data-q="${i}"><div class="qtitle"><span class="num">${i+1}</span>${x.q}</div>${x.o.map((v,j)=>`<label class="option" data-opt="${j}"><input type="radio" name="q${i}" value="${j}">(${letters[j]}) ${v}</label>`).join('')}<div class="explain"><b>答案：${letters[x.a]}</b>　${x.e}</div></section>`).join('');
 document.querySelectorAll('input[type=radio]').forEach(el=>el.addEventListener('change',updateProgress)); updateProgress();
}
function updateProgress(){let n=0;questions.forEach((_,i)=>{if(document.querySelector(`input[name=q${i}]:checked`))n++;});document.getElementById('progress').textContent=`已作答 ${n} / 20`;}
function grade(){
 let score=0,answered=0;graded=true;
 questions.forEach((x,i)=>{const card=document.querySelector(`[data-q="${i}"]`);const picked=document.querySelector(`input[name=q${i}]:checked`);card.querySelectorAll('.option').forEach(l=>l.classList.remove('correct','wrong'));card.querySelector(`[data-opt="${x.a}"]`).classList.add('correct');if(picked){answered++;if(Number(picked.value)===x.a)score++;else card.querySelector(`[data-opt="${picked.value}"]`).classList.add('wrong');}});
 const points=score*5;let msg=points>=90?'非常穩！':points>=70?'基礎不錯，再看一下錯題。':points>=60?'有抓到重點，錯題值得再複習。':'建議先看詳解，再重新挑戰一次。';
 result.style.display='block';result.innerHTML=`<strong>${points} 分</strong><div>${names[level]}程度｜答對 ${score} / 20 題${answered<20?`，未作答 ${20-answered} 題`:''}</div><div class="tiny" style="margin-top:6px">${msg}</div>`;result.scrollIntoView({behavior:'smooth',block:'center'});
}
function toggleExplain(){const boxes=[...document.querySelectorAll('.explain')];const show=boxes.some(x=>!x.classList.contains('show'));boxes.forEach(x=>x.classList.toggle('show',show));document.getElementById('explainBtn').textContent=show?'隱藏詳解':'顯示詳解';}
function restart(){if(!confirm('確定要清除目前答案，重新作答嗎？'))return;graded=false;render();result.style.display='none';document.getElementById('explainBtn').textContent='顯示詳解';window.scrollTo({top:0,behavior:'smooth'});}
function backToLevels(){startScreen.classList.remove('hidden');examScreen.classList.add('hidden');result.style.display='none';window.scrollTo({top:0,behavior:'smooth'});}
document.getElementById('submitBtn').addEventListener('click',grade);
document.getElementById('explainBtn').addEventListener('click',toggleExplain);
document.getElementById('restartBtn').addEventListener('click',restart);
document.getElementById('backBtn').addEventListener('click',backToLevels);
</script>
